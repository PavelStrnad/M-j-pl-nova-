<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json">
<title>Můj plán</title>
<style>
:root{
  --bg:#f5f5f7;--card:rgba(255,255,255,.86);--line:#e5e5ea;--text:#1d1d1f;
  --muted:#86868b;--blue:#007aff;--shadow:0 8px 28px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08);padding:15px 18px;position:sticky;top:0;z-index:10}
.head{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.head h1{font-size:21px;letter-spacing:-.35px;margin:0;font-weight:700}.head small{color:var(--muted);font-size:12px}
button{border:0;border-radius:11px;padding:10px 14px;font-weight:600;font-size:14px;background:#e9e9ee;color:var(--text);cursor:pointer;transition:.15s transform,.15s background}
button:active{transform:scale(.97)}
#authBtn{background:rgba(118,118,128,.10);white-space:nowrap}#notifyBtn{background:rgba(118,118,128,.10);white-space:nowrap}#notifyBtn.on{background:rgba(52,199,89,.12);color:#248a3d}#authBtn.signed{background:rgba(52,199,89,.12);color:#248a3d}#syncStatus{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.primary{background:var(--blue);color:white;box-shadow:0 2px 8px rgba(0,122,255,.22)}
main{max-width:1120px;margin:auto;padding:18px}
.calendar{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(0,0,0,.06);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.calhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px}
.calhead h2{text-align:center;font-size:18px;letter-spacing:-.25px;margin:0;text-transform:capitalize}
.calnav{display:flex;gap:5px;justify-content:flex-end}.calnav button,#today{min-width:40px;width:40px;height:40px;padding:0;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.weeknames,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.weeknames div{text-align:center;color:var(--muted);font-size:10px;font-weight:600;padding:5px 0;text-transform:uppercase;letter-spacing:.2px}
.day{min-width:0;min-height:58px;padding:8px 4px;border-radius:12px;background:rgba(118,118,128,.08);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;color:var(--text)}
.day.muted{opacity:.3}.day.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.day.selected{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.2)}
.day.selected .count{color:rgba(255,255,255,.85)}
.daynum{font-weight:600;font-size:14px}.count{font-size:9px;color:var(--muted);line-height:1}



.timeline{position:relative;background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:18px;overflow:hidden;height:960px;box-shadow:var(--shadow)}
.hour{height:120px;border-bottom:1px solid rgba(60,60,67,.10);position:relative}.hour:last-child{border-bottom:0}
.hour span{position:absolute;left:10px;top:7px;color:var(--muted);font-size:10px;font-weight:600;width:40px}
.slot{position:absolute;left:54px;right:0;top:0;height:120px;cursor:pointer}
.nowline{position:absolute;left:0;right:0;height:2px;background:#ff3b30;z-index:6;pointer-events:none;box-shadow:0 0 0 1px rgba(255,59,48,.08)}.nowline::before{content:"";position:absolute;left:49px;top:-4px;width:9px;height:9px;border-radius:50%;background:#ff3b30}.nowlabel{position:absolute;left:7px;top:-8px;font-size:9px;font-weight:700;color:#ff3b30;background:rgba(255,255,255,.96);padding:0 3px;border-radius:4px}.freegap{position:absolute;left:62px;right:10px;color:#a1a1a6;font-size:10px;text-align:center;z-index:1;pointer-events:none;font-weight:500;letter-spacing:.1px}
.task{position:absolute;left:60px;right:10px;border-radius:12px;padding:9px 12px;overflow:hidden;border-left:4px solid var(--blue);box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;background:rgba(255,255,255,.97);z-index:3}
.task .phone{display:block;margin-top:3px;font-size:10px;color:#007aff;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task .addr{display:block;margin-top:3px;font-size:10px;color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;letter-spacing:-.1px}.task .tnote{display:block;margin-top:4px;font-size:10px;color:#6e6e73;line-height:1.25;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.task small{display:block;margin-top:4px;font-size:10px;color:#6e6e73}.done{opacity:.45;text-decoration:line-through}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}
.box{background:rgba(255,255,255,.96);width:min(540px,100%);border-radius:22px 22px 0 0;padding:22px;max-height:90vh;overflow:auto;box-shadow:0 -10px 35px rgba(0,0,0,.14)}
.box h2{font-size:20px;letter-spacing:-.3px;margin:0 0 8px}
label{display:block;font-size:11px;font-weight:600;color:#6e6e73;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d2d2d7;border-radius:10px;background:#f9f9fb;color:var(--text);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}textarea{min-height:65px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:space-between;margin-top:18px}.danger{background:#ffe5e5;color:#d70015}
@media(max-width:600px){
  header{padding:13px 14px}.head h1{font-size:19px}main{padding:12px}#syncStatus{display:none}#authBtn,#notifyBtn{max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .calendar{padding:10px;border-radius:16px}.day{min-height:54px;padding-top:7px}
  .timeline{height:960px;border-radius:16px}.task{left:58px;right:8px;padding:8px 10px}
  
}
@media(min-width:700px){.modal{align-items:center}.box{border-radius:20px}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div><h1>📅 Můj plán</h1><small id="currentLabel">Dnes</small></div>
    <div style="display:flex;align-items:center;gap:8px"><small id="syncStatus" style="max-width:180px;text-align:right">Pouze toto zařízení</small><button id="notifyBtn">🔔 Upozornění</button><button id="authBtn">Přihlásit Google</button><button class="primary" id="new">＋ Úkol</button></div>
  </div>
</header>

<main>
  <section class="calendar">
    <div class="calhead">
      <button id="today">Dnes</button>
      <h2 id="monthLabel"></h2>
      <div class="calnav"><button id="prev" aria-label="Předchozí měsíc">‹</button><button id="next" aria-label="Další měsíc">›</button></div>
    </div>
    <div class="weeknames"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div>
    <div class="grid" id="calendarGrid"></div>
  </section>

  <div class="timeline" id="timeline"></div>
</main>

<div class="modal" id="modal"><div class="box">
<h2 id="modalTitle">Nový úkol</h2>
<label>Datum</label><input id="taskDate" type="date">
<label>Úkol</label><input id="title" placeholder="Co potřebuješ udělat?"><label>Adresa</label><input id="address" placeholder="Kam mám jet?"><label>Telefon</label><input id="phone" type="tel" inputmode="tel" placeholder="+420 123 456 789">
<div class="row"><div><label>Začátek</label><select id="start"></select></div><div><label>Délka</label><select id="duration">
<option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 hodina</option><option value="90">1,5 hodiny</option><option value="120">2 hodiny</option><option value="150">2,5 hodiny</option><option value="180">3 hodiny</option></select></div></div>
<label>🔔 Připomenout</label><select id="reminder"><option value="0">Bez připomenutí</option><option value="5">5 min předem</option><option value="10">10 min předem</option><option value="15">15 min předem</option><option value="30">30 min předem</option><option value="60">1 hodinu předem</option></select>
<button type="button" id="maps" style="display:none;margin-top:7px;width:100%">📍 Otevřít v Mapy.com</button><label>Barva</label><select id="color"><option value="#2563eb">Práce</option><option value="#16a34a">Osobní</option><option value="#9333ea">Důležité</option><option value="#ea580c">Schůzka</option></select>
<label>Poznámka</label><textarea id="note"></textarea>
<div class="actions"><button class="danger" id="delete" style="display:none">Smazat</button><div><button id="cancel">Zrušit</button> <button class="primary" id="save">Uložit</button></div></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDocs, onSnapshot, setDoc, deleteDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0Pv7jVDxbjqYEceizigXHa-VnDMTemlE",
  authDomain: "planovac-55294.firebaseapp.com",
  projectId: "planovac-55294",
  storageBucket: "planovac-55294.firebasestorage.app",
  messagingSenderId: "945202835965",
  appId: "1:945202835965:web:1bab0c7ffc9bf4b29c2994"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const googleProvider = new GoogleAuthProvider();
const VAPID_PUBLIC_KEY = "BIKn2Lr6o_nT_YJfJnufit_8yCeDdZLdyI4RWbXE9YnXeP8YDUDdxujyZv4r5bfZ0n6XhlJV5tZYQ1Cweba_yt4";

const names=["Po","Út","St","Čt","Pá","So","Ne"];
let selectedDate=new Date();selectedDate.setHours(0,0,0,0);
let calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
let edit=null,tasks=JSON.parse(localStorage.getItem("myplan")||"[]");
let currentUser=null, stopSync=null, cloudReady=false;
const $=x=>document.getElementById(x);

for(let m=480;m<900;m+=15){let o=document.createElement("option");o.value=m;o.textContent=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");$("start").appendChild(o)}

function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fromKey(k){let [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function label(d){return new Intl.DateTimeFormat("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d)}
function monthLabel(d){return new Intl.DateTimeFormat("cs-CZ",{month:"long",year:"numeric"}).format(d)}
function fmt(m){return Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":"")}
function time(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}


function saveLocal(){localStorage.setItem("myplan",JSON.stringify(tasks))}
function taskRef(id){return doc(db,"users",currentUser.uid,"tasks",String(id))}
async function cloudSet(t){if(!currentUser||!cloudReady)return;await setDoc(taskRef(t.id),t)}
async function cloudDelete(id){if(!currentUser||!cloudReady)return;await deleteDoc(taskRef(id))}
function setSync(text, signed=false){$("syncStatus").textContent=text;$("authBtn").classList.toggle("signed",signed)}


function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  const output=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)output[i]=raw.charCodeAt(i);
  return output;
}

function isHomeScreenApp(){
  return window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

async function enableNotifications(){
  if(!currentUser){alert("Nejdřív se přihlas přes Google.");return}
  if(!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)){
    alert("Tento prohlížeč nepodporuje webová upozornění.");return
  }
  if(!isHomeScreenApp()){
    alert("Nejdřív přidej Můj plán na plochu a potom ho spusť z ikony na ploše.");return
  }
  if(VAPID_PUBLIC_KEY === "VAPID_PUBLIC_KEY_HERE"){
    alert("Ještě je potřeba do aplikace vložit veřejný VAPID klíč.");return
  }
  try{
    setSync("Povoluji upozornění…",true);
    const permission=Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
    if(permission!=="granted"){
      setSync("Upozornění nejsou povolená",true);
      return
    }

    const swReg=await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let subscription=await swReg.pushManager.getSubscription();
    if(!subscription){
      subscription=await swReg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson=subscription.toJSON();
    if(!subJson?.endpoint || !subJson?.keys?.p256dh || !subJson?.keys?.auth){
      throw new Error("Push subscription je neúplný");
    }
    const deviceId=encodeURIComponent(subJson.endpoint);
    await setDoc(doc(db,"users",currentUser.uid,"devices",deviceId),{
      subscription:subJson,
      platform:navigator.userAgent,
      createdAt:Date.now(),
      updatedAt:Date.now()
    },{merge:true});
    $("notifyBtn").textContent="🔔 Zapnuto";
    $("notifyBtn").classList.add("on");
    setSync("Upozornění zapnuta",true);
  }catch(e){
    console.error("Web Push error:",e);
    setSync("Upozornění se nepodařilo zapnout",true);
    const detail=e?.message?`\n\nDetail: ${e.message}`:"";
    alert("Upozornění se nepodařilo zapnout."+detail);
  }
}

async function refreshNotificationState(){
  if(!currentUser){$("notifyBtn").textContent="🔔 Upozornění";$("notifyBtn").classList.remove("on");return}
  if("Notification" in window && Notification.permission === "granted"){
    $("notifyBtn").textContent="🔔 Zapnuto";$("notifyBtn").classList.add("on");
  }else{
    $("notifyBtn").textContent="🔔 Upozornění";$("notifyBtn").classList.remove("on");
  }
}

$("notifyBtn").onclick=enableNotifications;

$("authBtn").onclick=async()=>{
  try{
    if(currentUser){await signOut(auth);return}
    setSync("Přihlašuji…");
    await signInWithPopup(auth,googleProvider);
  }catch(e){
    console.error(e);
    setSync("Přihlášení se nepodařilo");
    alert("Přihlášení přes Google se nepodařilo. Zkontroluj, že je ve Firebase zapnuté Google přihlášení.");
  }
};

onAuthStateChanged(auth,async user=>{
  if(stopSync){stopSync();stopSync=null}
  currentUser=user;cloudReady=false;
  if(!user){setSync("Pouze toto zařízení");$("authBtn").textContent="Přihlásit Google";render();return}
  $("authBtn").textContent="Odhlásit";
  setSync("Synchronizuji…",true);
  try{
    const col=collection(db,"users",user.uid,"tasks");
    const first=await getDocs(col);
    if(first.empty && tasks.length){
      for(const t of tasks) await setDoc(doc(col,String(t.id)),t);
    }else if(!first.empty){
      tasks=first.docs.map(d=>({id:d.id,...d.data()}));
      saveLocal();render();
    }
    cloudReady=true;
    stopSync=onSnapshot(col,snap=>{
      tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
      saveLocal();render();
      setSync("Synchronizováno",true);
    },err=>{
      console.error(err);setSync("Chyba synchronizace",true);
    });
  }catch(e){
    console.error(e);setSync("Cloud není dostupný",true);
    alert("Firebase se nepodařilo připojit. Zkontroluj, že máš vytvořenou Firestore databázi a správná pravidla.");
  }
});

function renderCalendar(){
  $("monthLabel").textContent=monthLabel(calendarMonth);
  const grid=$("calendarGrid");grid.innerHTML="";
  const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
  const mondayIndex=(first.getDay()+6)%7;
  const daysInMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();
  const prevDays=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),0).getDate();
  const total=Math.ceil((mondayIndex+daysInMonth)/7)*7;
  const todayKey=key(new Date());
  for(let i=0;i<total;i++){
    let dayNum=i-mondayIndex+1;
    let d=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),dayNum);
    let current=d.getMonth()===calendarMonth.getMonth();
    let b=document.createElement("button");b.type="button";b.className="day"+(current?"":" muted")+(key(d)===todayKey?" today":"")+(key(d)===key(selectedDate)?" selected":"");
    let count=tasks.filter(t=>t.date===key(d)).length;
    b.innerHTML='<span class="daynum">'+d.getDate()+'</span>'+(count?'<span class="count">'+count+' úkol'+(count===1?'':'y')+'</span>':'');
    b.onclick=()=>{selectedDate=d;calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);render()};
    grid.appendChild(b);
  }
}

function render(){
  $("currentLabel").textContent=label(selectedDate);
  renderCalendar();
  let dateKey=key(selectedDate),dayTasks=tasks.filter(t=>t.date===dateKey);
  let tl=$("timeline");tl.innerHTML="";
  for(let h=8;h<16;h++){let row=document.createElement("div");row.className="hour";row.innerHTML='<span>'+String(h).padStart(2,"0")+':00</span>';row.onclick=()=>openNew(h*60);tl.appendChild(row)}
  const sorted=[...dayTasks].sort((a,b)=>a.start-b.start);
  let cursor=480;
  sorted.forEach(t=>{
    const gap=Math.max(0,t.start-cursor);
    if(gap>=15){
      let g=document.createElement("div");g.className="freegap";
      g.style.top=((cursor-480)*2+5)+"px";g.style.height=(gap*2-10)+"px";
      g.style.lineHeight=Math.max(14,gap*2-10)+"px";
      g.textContent="Volno "+fmt(gap);
      tl.appendChild(g);
    }
    let el=document.createElement("div");el.className="task"+(t.done?" done":"");el.dataset.id=t.id;
    el.style.top=((t.start-480)*2)+"px";el.style.height=Math.max(30,t.duration*2-4)+"px";el.style.borderLeftColor=t.color;el.style.zIndex=3;
    el.innerHTML='<b>'+esc(t.title)+'</b>'+(t.address?'<span class="addr">📍 '+esc(t.address)+'</span>':'')+(t.phone?'<a class="phone" href="tel:'+encodeURIComponent(t.phone)+'">☎️ '+esc(t.phone)+'</a>':'')+(t.note?'<span class="tnote">📝 '+esc(t.note)+'</span>':'')+'<small>'+time(t.start)+'–'+time(t.start+t.duration)+' · '+fmt(t.duration)+'</small>';
    el.onclick=e=>{if(e.target.closest("a"))return;e.stopPropagation();openEdit(t.id)};tl.appendChild(el);
    cursor=Math.max(cursor,t.start+t.duration);
  });
  const endGap=Math.max(0,960-cursor);
  if(endGap>=15){
    let g=document.createElement("div");g.className="freegap";
    g.style.top=((cursor-480)*2+5)+"px";g.style.height=(endGap*2-10)+"px";
    g.style.lineHeight=Math.max(14,endGap*2-10)+"px";
    g.textContent="Volno "+fmt(endGap);
    tl.appendChild(g);
  }
  renderNowLine();
  let total=dayTasks.reduce((a,t)=>a+t.duration,0);
}


let nowTimer=null;
function renderNowLine(){
  const old=$("nowline"); if(old) old.remove();
  const today=key(new Date());
  if(key(selectedDate)!==today) return;
  const now=new Date(), minutes=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  if(minutes<480 || minutes>960) return;
  const el=document.createElement("div");
  el.id="nowline"; el.className="nowline";
  el.style.top=((minutes-480)*2)+"px";
  const lab=document.createElement("span"); lab.className="nowlabel"; lab.textContent=time(Math.floor(minutes)); el.appendChild(lab);
  $("timeline").appendChild(el);
}
function startNowClock(){
  if(nowTimer) clearInterval(nowTimer);
  renderNowLine();
  nowTimer=setInterval(renderNowLine,30000);
}
function openNew(start=480){
  edit=null;$("modalTitle").textContent="Nový úkol";$("delete").style.display="none";
  $("taskDate").value=key(selectedDate);$("title").value="";$("address").value="";$("phone").value="";$("maps").style.display="none";$("note").value="";$("start").value=start;$("duration").value=60;$("reminder").value=0;$("color").value="#2563eb";
  $("modal").classList.add("show");setTimeout(()=>$("title").focus(),50);
}
function openEdit(id){
  let t=tasks.find(x=>x.id===id);if(!t)return;
  edit=id;$("modalTitle").textContent="Upravit úkol";$("delete").style.display="block";
  $("taskDate").value=t.date;$("title").value=t.title;$("address").value=t.address||"";$("phone").value=t.phone||"";$("maps").style.display=t.address?"block":"none";$("note").value=t.note||"";$("start").value=t.start;$("duration").value=t.duration;$("reminder").value=t.reminderMinutes||0;$("color").value=t.color;
  $("modal").classList.add("show");
}
function close(){$("modal").classList.remove("show")}

$("new").onclick=()=>openNew();
$("prev").onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar()};
$("next").onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar()};
$("today").onclick=()=>{selectedDate=new Date();selectedDate.setHours(0,0,0,0);calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);render()};
$("cancel").onclick=close;

$("address").addEventListener("input",()=>{
  $("maps").style.display=$("address").value.trim()?"block":"none";
});
$("maps").onclick=()=>{
  const a=$("address").value.trim();
  if(a) window.location.href="https://mapy.com/zakladni?q="+encodeURIComponent(a);
};

$("save").onclick=()=>{
  const title=$("title").value.trim(),date=$("taskDate").value;
  if(!title){alert("Zadej název úkolu");return}
  if(!date){alert("Vyber datum");return}
  let old=edit?tasks.find(t=>t.id===edit):null;
  const start=+$('start').value, duration=+$('duration').value, reminderMinutes=+$('reminder').value;
  const d=fromKey(date); d.setHours(Math.floor(start/60),start%60,0,0);
  const reminderAtMs=reminderMinutes>0 ? d.getTime()-reminderMinutes*60000 : 0;
  let t={id:edit||Date.now().toString(),date,start,duration,title:$("title").value.trim(),address:$("address").value.trim(),phone:$("phone").value.trim(),color:$("color").value,note:$("note").value.trim(),done:old?old.done:false,reminderMinutes,reminderAtMs,reminderSentAtMs:old&&old.reminderAtMs===reminderAtMs?(old.reminderSentAtMs||0):0};
  if(edit)tasks=tasks.map(x=>x.id===edit?t:x);else tasks.push(t);
  selectedDate=fromKey(date);calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
  saveLocal();close();render();if(currentUser&&cloudReady) cloudSet(t).catch(e=>console.error(e));
};

$("delete").onclick=()=>{
  if(edit&&confirm("Smazat úkol?")){const id=edit;tasks=tasks.filter(t=>t.id!==id);saveLocal();close();render();if(currentUser&&cloudReady) cloudDelete(id).catch(e=>console.error(e));}
};

$("timeline").ondblclick=e=>{
  let el=e.target.closest(".task");if(el){let t=tasks.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;saveLocal();render();if(currentUser&&cloudReady) updateDoc(taskRef(t.id),{done:t.done}).catch(e=>console.error(e));}}
};

render();
refreshNotificationState();
startNowClock();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body></html>
